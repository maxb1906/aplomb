# Catalogue des règles d'audit d'Aplomb.
#
# Règles maison, pragmatiques pour des PME. Pas de CIS (ni contenu, ni
# identifiants). Les références sont indicatives : on cite la source, on ne
# recopie pas son contenu.
#
# Champs :
#   id           identifiant stable (CAT-NNN), jamais réutilisé
#   category     system, services, tasks, accounts, bitlocker, defender, smb, firewall
#   level        info | warning | critical (niveau par défaut ; un constat peut le préciser)
#   profiles     workstation, server, dc (vide : tous)
#   admin        true si le contrôle exige les droits administrateur
#   refs         références indicatives
#   remediation  commande PowerShell (modèle Go text/template ; {{ps .x}} cite une valeur)
#   text.fr/en   title, summary (pour le client), detail (technique), impact, gpo
#                Les variables {nom} sont remplacées par les paramètres du constat.

# ---------------------------------------------------------------- Système
- id: SYS-012
  category: system
  level: warning
  refs:
    - name: "ANSSI — Guide d'hygiène informatique (mises à jour)"
      url: https://cyber.gouv.fr/publications/guide-dhygiene-informatique
    - name: "MITRE ATT&CK T1068 — Exploitation for Privilege Escalation"
      url: https://attack.mitre.org/techniques/T1068/
  remediation: |
    Start-Process 'ms-settings:windowsupdate'
  text:
    fr:
      title: Mises à jour Windows en retard
      summary: >-
        La dernière mise à jour installée date du {date} ({days} jours). Les failles
        corrigées depuis restent exploitables sur cette machine.
      detail: >-
        Date la plus récente de Win32_QuickFixEngineering ({kb}). Attention au-delà de
        30 jours, Critique au-delà de 60 jours.
      impact: L'installation des mises à jour peut demander un redémarrage.
      gpo: Configuration ordinateur > Modèles d'administration > Composants Windows > Windows Update
    en:
      title: Windows updates are overdue
      summary: >-
        The latest installed update dates from {date} ({days} days ago). Vulnerabilities
        fixed since then remain exploitable on this machine.
      detail: >-
        Most recent date in Win32_QuickFixEngineering ({kb}). Warning beyond 30 days,
        Critical beyond 60 days.
      impact: Installing updates may require a restart.
      gpo: Computer Configuration > Administrative Templates > Windows Components > Windows Update

- id: SYS-013
  category: system
  level: warning
  refs:
    - name: "Microsoft — Secure Boot"
      url: https://learn.microsoft.com/windows-hardware/design/device-experiences/oem-secure-boot
    - name: "MITRE ATT&CK T1542 — Pre-OS Boot"
      url: https://attack.mitre.org/techniques/T1542/
  remediation: |
    Confirm-SecureBootUEFI
  text:
    fr:
      title: Démarrage sécurisé (Secure Boot) désactivé
      summary: >-
        Le démarrage sécurisé empêche un logiciel malveillant de se lancer avant Windows.
        Il est désactivé ou indisponible (firmware {firmware}).
      detail: >-
        HKLM\SYSTEM\CurrentControlSet\Control\SecureBoot\State\UEFISecureBootEnabled ≠ 1,
        ou démarrage en mode BIOS hérité (Secure Boot impossible sans UEFI).
      impact: >-
        À activer dans le setup UEFI. Passer d'un démarrage BIOS à UEFI demande de
        convertir le disque (mbr2gpt) : à planifier.
    en:
      title: Secure Boot is disabled
      summary: >-
        Secure Boot prevents malware from starting before Windows. It is disabled or
        unavailable (firmware {firmware}).
      detail: >-
        HKLM\SYSTEM\CurrentControlSet\Control\SecureBoot\State\UEFISecureBootEnabled ≠ 1,
        or legacy BIOS boot (Secure Boot requires UEFI).
      impact: >-
        Enable it in the UEFI setup. Moving from BIOS to UEFI boot requires converting
        the disk (mbr2gpt): plan ahead.

# ---------------------------------------------------------------- Services
- id: SVC-001
  category: services
  level: critical
  refs:
    - name: "MITRE ATT&CK T1574.009 — Path Interception by Unquoted Path"
      url: https://attack.mitre.org/techniques/T1574/009/
  remediation: |
    Set-ItemProperty -Path {{ps .key}} -Name ImagePath -Value {{ps .fixed}}
    Restart-Service -Name {{ps .service}}
  text:
    fr:
      title: Service avec un chemin sans guillemets
      summary: >-
        Le chemin de ce service contient des espaces sans être entre guillemets. Windows
        peut alors lancer un autre programme placé au mauvais endroit, avec les droits du
        service.
      detail: >-
        ImagePath non cité contenant des espaces, hors %SystemRoot%. Critique si un dossier
        intermédiaire est inscriptible par des non-administrateurs (exploitation possible),
        Attention sinon.
      impact: Ajouter les guillemets est sans risque ; le service doit être redémarré pour en tenir compte.
    en:
      title: Service with an unquoted path
      summary: >-
        This service's path contains spaces but is not quoted. Windows may then start
        another program placed in the wrong location, with the service's privileges.
      detail: >-
        Unquoted ImagePath containing spaces, outside %SystemRoot%. Critical if an
        intermediate folder is writable by non-administrators (exploitable), Warning otherwise.
      impact: Adding the quotes is safe; the service must be restarted to take it into account.

- id: SVC-002
  category: services
  level: critical
  refs:
    - name: "MITRE ATT&CK T1574.010 — Services File Permissions Weakness"
      url: https://attack.mitre.org/techniques/T1574/010/
  remediation: |
    icacls {{ps .path}} /remove:g {{.sids}}
    icacls {{ps .path}}
  text:
    fr:
      title: Programme de service modifiable par des utilisateurs
      summary: >-
        Des utilisateurs sans droits d'administration peuvent modifier le programme d'un
        service ou son dossier. N'importe lequel d'entre eux peut ainsi prendre le contrôle
        total de la machine.
      detail: >-
        Droits accordés à Tout le monde, Utilisateurs, Utilisateurs authentifiés… : modifier
        l'exécutable ou le remplacer dans son dossier (Critique) ; seulement ajouter un
        fichier dans le dossier, ce qui permet de déposer une DLL (Attention).
      impact: >-
        icacls /remove ne retire que les droits explicites : si les droits sont hérités,
        corriger le dossier parent. Vérifier que le logiciel fonctionne toujours (certains
        programmes mal conçus écrivent dans leur dossier d'installation).
    en:
      title: Service program writable by users
      summary: >-
        Users without administrator rights can modify a service's program or its folder.
        Any of them can thereby take full control of the machine.
      detail: >-
        Rights granted to Everyone, Users, Authenticated Users…: modify the executable or
        replace it in its folder (Critical); only add a file to the folder, which allows
        planting a DLL (Warning).
      impact: >-
        icacls /remove only removes explicit entries: if the rights are inherited, fix the
        parent folder. Check that the software still works (some poorly designed programs
        write into their install folder).

- id: SVC-003
  category: services
  level: critical
  refs:
    - name: "MITRE ATT&CK T1574.011 — Services Registry Permissions Weakness"
      url: https://attack.mitre.org/techniques/T1574/011/
  remediation: |
    $k = {{ps .key}}
    $bad = @({{.sids}})
    $acl = Get-Acl -Path $k
    $acl.Access | Where-Object { -not $_.IsInherited -and $bad -contains $_.IdentityReference.Translate([Security.Principal.SecurityIdentifier]).Value } | ForEach-Object { [void]$acl.RemoveAccessRule($_) }
    Set-Acl -Path $k -AclObject $acl
  text:
    fr:
      title: Configuration de service modifiable par des utilisateurs
      summary: >-
        La configuration de ce service dans le registre peut être modifiée par des
        utilisateurs sans droits d'administration : ils peuvent lui faire lancer le
        programme de leur choix avec les droits du système.
      detail: >-
        Droits SetValue, CreateSubKey, WriteDAC ou WriteOwner pour des groupes non
        administrateurs sur HKLM\SYSTEM\CurrentControlSet\Services\<service>.
      impact: Seules les entrées explicites sont retirées ; vérifier le résultat avec Get-Acl.
    en:
      title: Service configuration writable by users
      summary: >-
        This service's registry configuration can be modified by users without
        administrator rights: they can make it run the program of their choice with
        system privileges.
      detail: >-
        SetValue, CreateSubKey, WriteDAC or WriteOwner rights for non-administrator groups
        on HKLM\SYSTEM\CurrentControlSet\Services\<service>.
      impact: Only explicit entries are removed; check the result with Get-Acl.

- id: SVC-004
  category: services
  level: warning
  refs:
    - name: "MITRE ATT&CK T1543.003 — Windows Service"
      url: https://attack.mitre.org/techniques/T1543/003/
  remediation: |
    Stop-Service -Name {{ps .service}} -Force
    Set-Service -Name {{ps .service}} -StartupType Disabled
  text:
    fr:
      title: Service système lancé depuis un dossier utilisateur
      summary: >-
        Un service tiers tourne avec les droits les plus élevés (SYSTEM) depuis un dossier
        utilisateur ou temporaire. C'est inhabituel pour un logiciel légitime et typique
        d'un logiciel indésirable.
      detail: >-
        Service LocalSystem dont l'exécutable est sous \Users\, \AppData\, \Temp\ ou
        \Downloads\.
      impact: >-
        Identifier le logiciel avant de le désactiver. S'il est légitime, le réinstaller
        dans « Program Files ».
    en:
      title: System service started from a user folder
      summary: >-
        A third-party service runs with the highest privileges (SYSTEM) from a user or
        temporary folder. This is unusual for legitimate software and typical of unwanted
        software.
      detail: >-
        LocalSystem service whose executable is under \Users\, \AppData\, \Temp\ or
        \Downloads\.
      impact: >-
        Identify the software before disabling it. If it is legitimate, reinstall it under
        "Program Files".

- id: SVC-005
  category: services
  level: warning
  profiles: [server, dc]
  refs:
    - name: "Microsoft — Print Spooler (CVE-2021-34527, « PrintNightmare »)"
      url: https://msrc.microsoft.com/update-guide/vulnerability/CVE-2021-34527
    - name: "MITRE ATT&CK T1210 — Exploitation of Remote Services"
      url: https://attack.mitre.org/techniques/T1210/
  remediation: |
    Stop-Service -Name Spooler -Force
    Set-Service -Name Spooler -StartupType Disabled
  text:
    fr:
      title: Service d'impression actif sans utilité
      summary: >-
        Le service d'impression (spouleur) tourne sur un serveur qui n'imprime pas, ou sur
        un contrôleur de domaine. Il a été à l'origine de failles graves et ne devrait pas y
        être actif.
      detail: >-
        Service Spooler en cours d'exécution sur un contrôleur de domaine, ou sur un
        serveur sans imprimante installée (hors imprimantes virtuelles Microsoft).
      impact: Plus aucune impression ni partage d'imprimante ne sera possible depuis cette machine.
      gpo: Configuration ordinateur > Stratégies > Paramètres Windows > Paramètres de sécurité > Services système > Spouleur d'impression
    en:
      title: Print service running needlessly
      summary: >-
        The print service (spooler) runs on a server that does not print, or on a domain
        controller. It has been the source of severe vulnerabilities and should not be
        running there.
      detail: >-
        Spooler service running on a domain controller, or on a server with no installed
        printer (Microsoft virtual printers excluded).
      impact: No printing or printer sharing will be possible from this machine any more.
      gpo: Computer Configuration > Policies > Windows Settings > Security Settings > System Services > Print Spooler

# ---------------------------------------------------------------- Tâches planifiées
- id: TSK-001
  category: tasks
  level: critical
  refs:
    - name: "MITRE ATT&CK T1053.005 — Scheduled Task"
      url: https://attack.mitre.org/techniques/T1053/005/
  remediation: |
    icacls {{ps .path}} /remove:g {{.sids}}
    icacls {{ps .path}}
  text:
    fr:
      title: Tâche à privilèges élevés lançant un fichier modifiable
      summary: >-
        Une tâche planifiée qui s'exécute avec des droits élevés lance un programme ou un
        script que n'importe quel utilisateur peut modifier ou remplacer. Il suffit de le
        modifier pour obtenir le contrôle total de la machine.
      detail: >-
        Tâche active exécutée en SYSTEM, LocalService, NetworkService, Administrateurs ou
        « privilèges les plus élevés », dont l'exécutable, le script ou leur dossier est
        inscriptible par des groupes non administrateurs (y compris un exécutable manquant
        dont le dossier est inscriptible).
      impact: >-
        Seules les entrées explicites sont retirées ; si les droits sont hérités, corriger
        le dossier parent. Vérifier ensuite que la tâche fonctionne toujours.
    en:
      title: High-privilege task running a writable file
      summary: >-
        A scheduled task running with high privileges starts a program or script that any
        user can modify or replace. Modifying it is enough to take full control of the
        machine.
      detail: >-
        Enabled task running as SYSTEM, LocalService, NetworkService, Administrators or
        "highest privileges", whose executable, script or their folder is writable by
        non-administrator groups (including a missing executable in a writable folder).
      impact: >-
        Only explicit entries are removed; if the rights are inherited, fix the parent
        folder. Then check that the task still works.

- id: TSK-002
  category: tasks
  level: warning
  refs:
    - name: "MITRE ATT&CK T1053.005 — Scheduled Task"
      url: https://attack.mitre.org/techniques/T1053/005/
  remediation: |
    Get-ScheduledTask -TaskPath {{ps .folder}} -TaskName {{ps .name}} | Select-Object -ExpandProperty Actions
    Disable-ScheduledTask -TaskPath {{ps .folder}} -TaskName {{ps .name}}
  text:
    fr:
      title: Tâche à privilèges élevés lancée depuis un dossier temporaire ou utilisateur
      summary: >-
        Une tâche avec des droits élevés lance un programme situé dans un dossier
        temporaire, de profil ou public. C'est une pratique risquée, et une technique
        courante de persistance des logiciels malveillants.
      detail: >-
        Exécutable ou script sous %TEMP%, AppData, Users\Public, Downloads, ou sous
        ProgramData dans un dossier inscriptible par des non-administrateurs.
      impact: Vérifier l'origine de la tâche avant de la désactiver ; si elle est légitime, déplacer le programme dans « Program Files ».
    en:
      title: High-privilege task started from a temporary or user folder
      summary: >-
        A high-privilege task starts a program located in a temporary, profile or public
        folder. This is a risky practice and a common malware persistence technique.
      detail: >-
        Executable or script under %TEMP%, AppData, Users\Public, Downloads, or under
        ProgramData in a folder writable by non-administrators.
      impact: Check where the task comes from before disabling it; if it is legitimate, move the program under "Program Files".

- id: TSK-003
  category: tasks
  level: warning
  refs:
    - name: "MITRE ATT&CK T1027 — Obfuscated Files or Information"
      url: https://attack.mitre.org/techniques/T1027/
    - name: "MITRE ATT&CK T1218.005 — Mshta"
      url: https://attack.mitre.org/techniques/T1218/005/
    - name: "MITRE ATT&CK T1197 — BITS Jobs"
      url: https://attack.mitre.org/techniques/T1197/
  remediation: |
    Get-ScheduledTask -TaskPath {{ps .folder}} -TaskName {{ps .name}} | Select-Object -ExpandProperty Actions
    Disable-ScheduledTask -TaskPath {{ps .folder}} -TaskName {{ps .name}}
  text:
    fr:
      title: Tâche planifiée avec une commande suspecte
      summary: >-
        Une tâche lance une commande typique des logiciels malveillants (commande
        PowerShell encodée ou masquée, téléchargement, mshta…). Elle doit être examinée.
      detail: >-
        Indices : powershell -EncodedCommand / -WindowStyle Hidden / téléchargement et
        exécution, mshta, rundll32 ou regsvr32 avec une URL, certutil -urlcache/-decode,
        bitsadmin /transfer.
      impact: >-
        Désactiver la tâche ne supprime pas un éventuel logiciel malveillant : en cas de doute, faire analyser la machine.
    en:
      title: Scheduled task with a suspicious command
      summary: >-
        A task runs a command typical of malware (encoded or hidden PowerShell command,
        download, mshta…). It must be examined.
      detail: >-
        Indicators: powershell -EncodedCommand / -WindowStyle Hidden / download and
        execute, mshta, rundll32 or regsvr32 with a URL, certutil -urlcache/-decode,
        bitsadmin /transfer.
      impact: >-
        Disabling the task does not remove any malware: if in doubt, have the machine scanned.

- id: TSK-004
  category: tasks
  level: info
  refs:
    - name: "MITRE ATT&CK T1053.005 — Scheduled Task"
      url: https://attack.mitre.org/techniques/T1053/005/
  remediation: |
    Get-ScheduledTask -TaskPath {{ps .folder}} -TaskName {{ps .name}} | Format-List *
  text:
    fr:
      title: Tâche masquée ou sans auteur
      summary: >-
        Des tâches planifiées hors Microsoft sont masquées ou n'indiquent pas leur auteur.
        C'est souvent anodin, mais elles méritent un coup d'œil.
      detail: Tâche hors \Microsoft\ avec Settings.Hidden = vrai ou RegistrationInfo.Author vide.
    en:
      title: Hidden or authorless task
      summary: >-
        Non-Microsoft scheduled tasks are hidden or do not state their author. This is often
        harmless, but they deserve a look.
      detail: Task outside \Microsoft\ with Settings.Hidden = true or an empty RegistrationInfo.Author.

- id: TSK-005
  category: tasks
  level: info
  refs:
    - name: "MITRE ATT&CK T1053.005 — Scheduled Task"
      url: https://attack.mitre.org/techniques/T1053/005/
  remediation: |
    Unregister-ScheduledTask -TaskPath {{ps .folder}} -TaskName {{ps .name}} -Confirm:$false
  text:
    fr:
      title: Tâche planifiée orpheline
      summary: >-
        Des tâches planifiées lancent un programme qui n'existe plus (logiciel désinstallé).
        Elles sont inutiles et peuvent être supprimées.
      detail: Exécutable de l'action introuvable après résolution des variables et du chemin système.
      impact: Vérifier que le programme n'est pas sur un lecteur réseau ou amovible absent pendant l'audit.
    en:
      title: Orphaned scheduled task
      summary: >-
        Scheduled tasks start a program that no longer exists (uninstalled software). They
        are useless and can be deleted.
      detail: Action executable not found after resolving variables and the system path.
      impact: Check that the program is not on a network or removable drive missing during the audit.

# ---------------------------------------------------------------- Comptes et mots de passe
- id: ACC-001
  category: accounts
  level: warning
  refs:
    - name: "ANSSI — Recommandations relatives à l'authentification multifacteur et aux mots de passe"
      url: https://cyber.gouv.fr/publications/recommandations-relatives-lauthentification-multifacteur-et-aux-mots-de-passe
    - name: "MITRE ATT&CK T1110 — Brute Force"
      url: https://attack.mitre.org/techniques/T1110/
  remediation: |
    net accounts /minpwlen:{{.want}}
  text:
    fr:
      title: Longueur minimale des mots de passe insuffisante
      summary: >-
        Les mots de passe peuvent ne faire que {current} caractères. Des mots de passe courts
        se devinent ou se cassent rapidement ; il en faudrait au moins {want}.
      detail: >-
        NetUserModalsGet : usrmod0_min_passwd_len. Seuil : 12 caractères pour un poste,
        14 pour un serveur ou un contrôleur de domaine.
      impact: S'applique aux prochains changements de mot de passe ; prévenir les utilisateurs.
      gpo: Configuration ordinateur > Stratégies > Paramètres Windows > Paramètres de sécurité > Stratégies de comptes > Stratégie de mot de passe > Longueur minimale du mot de passe
    en:
      title: Minimum password length too short
      summary: >-
        Passwords can be as short as {current} characters. Short passwords are quickly
        guessed or cracked; at least {want} would be needed.
      detail: >-
        NetUserModalsGet: usrmod0_min_passwd_len. Threshold: 12 characters for a
        workstation, 14 for a server or domain controller.
      impact: Applies at the next password changes; let users know.
      gpo: Computer Configuration > Policies > Windows Settings > Security Settings > Account Policies > Password Policy > Minimum password length

- id: ACC-002
  category: accounts
  level: warning
  refs:
    - name: "MITRE ATT&CK T1110.001 — Password Guessing"
      url: https://attack.mitre.org/techniques/T1110/001/
  remediation: |
    net accounts /lockoutthreshold:10 /lockoutwindow:15 /lockoutduration:15
  text:
    fr:
      title: Aucun verrouillage des comptes après des échecs de connexion
      summary: >-
        Un attaquant peut essayer autant de mots de passe qu'il veut sans que le compte ne
        soit bloqué.
      detail: >-
        NetUserModalsGet niveau 3 : seuil de verrouillage = 0.
      impact: >-
        Un seuil trop bas peut bloquer des utilisateurs (ou être utilisé pour les bloquer
        volontairement) : 10 essais sur 15 minutes est un compromis courant.
      gpo: Configuration ordinateur > Stratégies > Paramètres Windows > Paramètres de sécurité > Stratégies de comptes > Stratégie de verrouillage du compte
    en:
      title: No account lockout after failed logons
      summary: >-
        An attacker can try as many passwords as they want without the account being
        locked.
      detail: NetUserModalsGet level 3 — lockout threshold = 0.
      impact: >-
        A threshold that is too low can lock users out (or be abused to lock them out on
        purpose): 10 attempts over 15 minutes is a common compromise.
      gpo: Computer Configuration > Policies > Windows Settings > Security Settings > Account Policies > Account Lockout Policy

- id: ACC-003
  category: accounts
  level: info
  refs:
    - name: "ANSSI — Recommandations relatives à l'authentification multifacteur et aux mots de passe"
      url: https://cyber.gouv.fr/publications/recommandations-relatives-lauthentification-multifacteur-et-aux-mots-de-passe
  remediation: |
    net accounts /minpwlen:{{.want}}
  text:
    fr:
      title: Mots de passe sans expiration et sans longueur compensatoire
      summary: >-
        Les mots de passe n'expirent jamais, sans que leur longueur minimale soit assez
        élevée pour compenser. Un mot de passe divulgué reste alors valable indéfiniment.
      detail: >-
        Durée de vie maximale illimitée et longueur minimale inférieure à 14 caractères.
        L'expiration régulière n'est plus recommandée si les mots de passe sont longs : on
        préfère augmenter la longueur.
      gpo: Configuration ordinateur > Stratégies > Paramètres Windows > Paramètres de sécurité > Stratégies de comptes > Stratégie de mot de passe
    en:
      title: Passwords never expire and are not long enough to compensate
      summary: >-
        Passwords never expire, and their minimum length is not high enough to make up for
        it. A leaked password then remains valid indefinitely.
      detail: >-
        Unlimited maximum password age and minimum length below 14 characters. Regular
        expiration is no longer recommended when passwords are long: increasing the length
        is preferred.
      gpo: Computer Configuration > Policies > Windows Settings > Security Settings > Account Policies > Password Policy

- id: ACC-004
  category: accounts
  level: warning
  refs:
    - name: "MITRE ATT&CK T1110 — Brute Force"
      url: https://attack.mitre.org/techniques/T1110/
  remediation: |
    $inf = Join-Path $env:TEMP 'aplomb-sec.inf'
    secedit /export /cfg $inf /areas SECURITYPOLICY
    (Get-Content $inf) -replace '^PasswordComplexity\s*=\s*0', 'PasswordComplexity = 1' | Set-Content $inf
    secedit /configure /db (Join-Path $env:TEMP 'aplomb-sec.sdb') /cfg $inf /areas SECURITYPOLICY
    Remove-Item $inf
  text:
    fr:
      title: Complexité des mots de passe désactivée
      summary: >-
        Les mots de passe ne sont pas tenus de mélanger majuscules, minuscules, chiffres ou
        symboles, alors qu'ils sont courts : « motdepasse » serait accepté.
      detail: >-
        SamQueryInformationDomain : DOMAIN_PASSWORD_COMPLEX absent de PasswordProperties,
        avec une longueur minimale inférieure à 14 caractères (une longueur de 14 et plus
        est considérée comme compensatoire).
      impact: S'applique aux prochains changements de mot de passe.
      gpo: Configuration ordinateur > Stratégies > Paramètres Windows > Paramètres de sécurité > Stratégies de comptes > Stratégie de mot de passe > Le mot de passe doit respecter des exigences de complexité
    en:
      title: Password complexity disabled
      summary: >-
        Passwords are not required to mix upper case, lower case, digits or symbols, while
        they are short: "password" would be accepted.
      detail: >-
        SamQueryInformationDomain: DOMAIN_PASSWORD_COMPLEX missing from PasswordProperties,
        with a minimum length below 14 characters (a length of 14 or more is considered
        compensating).
      impact: Applies at the next password changes.
      gpo: Computer Configuration > Policies > Windows Settings > Security Settings > Account Policies > Password Policy > Password must meet complexity requirements

- id: ACC-005
  category: accounts
  level: critical
  refs:
    - name: "MITRE ATT&CK T1078.001 — Default Accounts"
      url: https://attack.mitre.org/techniques/T1078/001/
  remediation: |
    {{if eq .role "dc"}}Get-ADUser -Filter * | Where-Object { $_.SID.Value -like '*-501' } | Disable-ADAccount{{else}}Get-LocalUser | Where-Object { $_.SID.Value -like '*-501' } | Disable-LocalUser{{end}}
  text:
    fr:
      title: Compte Invité activé
      summary: >-
        Le compte Invité est activé : n'importe qui peut ouvrir une session ou accéder aux
        partages sans mot de passe personnel.
      detail: Compte de RID 501 sans l'indicateur UF_ACCOUNTDISABLE.
      gpo: >-
        Configuration ordinateur > Stratégies > Paramètres Windows > Paramètres de sécurité > Stratégies locales > Options de sécurité > Comptes : état du compte Invité
    en:
      title: Guest account enabled
      summary: >-
        The Guest account is enabled: anyone can log on or access shares without a
        personal password.
      detail: Account with RID 501 without the UF_ACCOUNTDISABLE flag.
      gpo: Computer Configuration > Policies > Windows Settings > Security Settings > Local Policies > Security Options > Accounts — Guest account status

- id: ACC-006
  category: accounts
  level: warning
  profiles: [workstation, server]
  refs:
    - name: "MITRE ATT&CK T1078.003 — Local Accounts"
      url: https://attack.mitre.org/techniques/T1078/003/
    - name: "Microsoft — Windows LAPS"
      url: https://learn.microsoft.com/windows-server/identity/laps/laps-overview
  remediation: |
    Get-LocalUser | Where-Object { $_.SID.Value -like '*-500' } | Disable-LocalUser
  text:
    fr:
      title: Compte Administrateur intégré activé
      summary: >-
        Le compte « Administrateur » intégré est activé. Son nom est connu de tous et il
        n'est jamais verrouillé : c'est la première cible des attaques par mot de passe.
      detail: Compte local de RID 500 activé.
      impact: >-
        Vérifier qu'un autre compte administrateur nominatif existe et fonctionne avant de
        le désactiver. Si ce compte est géré par LAPS, il peut rester actif.
      gpo: >-
        Configuration ordinateur > Stratégies > Paramètres Windows > Paramètres de sécurité > Stratégies locales > Options de sécurité > Comptes : état du compte Administrateur
    en:
      title: Built-in Administrator account enabled
      summary: >-
        The built-in "Administrator" account is enabled. Its name is well known and it is
        never locked out: it is the first target of password attacks.
      detail: Local account with RID 500 enabled.
      impact: >-
        Check that another named administrator account exists and works before disabling
        it. If this account is managed by LAPS, it can stay enabled.
      gpo: Computer Configuration > Policies > Windows Settings > Security Settings > Local Policies > Security Options > Accounts — Administrator account status

- id: ACC-007
  category: accounts
  level: warning
  refs:
    - name: "MITRE ATT&CK T1098 — Account Manipulation"
      url: https://attack.mitre.org/techniques/T1098/
  remediation: |
    Remove-LocalGroupMember -SID S-1-5-32-544 -Member {{ps .member}}
  text:
    fr:
      title: Trop de membres dans le groupe Administrateurs
      summary: >-
        {count} comptes ou groupes (en plus des comptes intégrés) ont les droits
        d'administration sur cette machine. Chacun d'eux peut tout y faire : il faut limiter
        cette liste au strict nécessaire.
      detail: >-
        Membres de S-1-5-32-544, hors Administrateur intégré (RID 500), Admins du domaine
        (RID 512), Administrateurs de l'entreprise (RID 519) et rôles d'administration Entra
        ID. Seuil : plus de {max}.
      impact: Vérifier avec le client qui a réellement besoin des droits d'administration avant de retirer un membre.
    en:
      title: Too many members in the Administrators group
      summary: >-
        {count} accounts or groups (besides the built-in ones) have administrator rights on
        this machine. Each of them can do anything here: this list must be limited to the
        bare minimum.
      detail: >-
        Members of S-1-5-32-544, excluding the built-in Administrator (RID 500), Domain
        Admins (RID 512), Enterprise Admins (RID 519) and Entra ID admin roles. Threshold:
        more than {max}.
      impact: Check with the client who really needs administrator rights before removing a member.

- id: ACC-008
  category: accounts
  level: warning
  profiles: [workstation, server]
  refs:
    - name: "MITRE ATT&CK T1078.003 — Local Accounts"
      url: https://attack.mitre.org/techniques/T1078/003/
  remediation: |
    net user {{ps .user}} /passwordreq:yes
  text:
    fr:
      title: Compte local autorisé sans mot de passe
      summary: >-
        Des comptes locaux actifs ont le droit de ne pas avoir de mot de passe. Un compte
        sans mot de passe est accessible à quiconque connaît son nom.
      detail: Indicateur UF_PASSWD_NOTREQD sur un compte local activé.
      impact: Le compte devra recevoir un mot de passe avant sa prochaine utilisation.
    en:
      title: Local account allowed without a password
      summary: >-
        Enabled local accounts are allowed to have no password. An account without a
        password is accessible to anyone who knows its name.
      detail: UF_PASSWD_NOTREQD flag on an enabled local account.
      impact: The account will need a password before it is next used.

- id: ACC-009
  category: accounts
  level: warning
  profiles: [workstation, server]
  refs:
    - name: "MITRE ATT&CK T1078.003 — Local Accounts"
      url: https://attack.mitre.org/techniques/T1078/003/
  remediation: |
    Set-LocalUser -Name {{ps .user}} -PasswordNeverExpires $false
  text:
    fr:
      title: Compte local dont le mot de passe n'expire jamais
      summary: >-
        La politique impose de changer les mots de passe, mais des comptes locaux actifs en
        sont dispensés : leur mot de passe peut rester le même pendant des années.
      detail: >-
        Indicateur UF_DONT_EXPIRE_PASSWD sur un compte local activé, alors que la politique
        fixe une durée de vie maximale et une longueur minimale inférieure à 14 caractères.
      impact: L'utilisateur devra changer son mot de passe à l'échéance suivante ; ne pas appliquer aux comptes de service sans prévoir leur rotation.
    en:
      title: Local account whose password never expires
      summary: >-
        The policy requires passwords to be changed, but enabled local accounts are exempt:
        their password can stay the same for years.
      detail: >-
        UF_DONT_EXPIRE_PASSWD flag on an enabled local account, while the policy sets a
        maximum password age and a minimum length below 14 characters.
      impact: The user will have to change their password at the next deadline; do not apply to service accounts without planning their rotation.

- id: ACC-010
  category: accounts
  level: warning
  profiles: [workstation, server]
  refs:
    - name: "Microsoft — Windows LAPS"
      url: https://learn.microsoft.com/windows-server/identity/laps/laps-overview
    - name: "MITRE ATT&CK T1550.002 — Pass the Hash"
      url: https://attack.mitre.org/techniques/T1550/002/
  remediation: |
    {{if .ou}}Update-LapsADSchema
    Set-LapsADComputerSelfPermission -Identity {{ps .ou}}
    {{end}}Invoke-LapsPolicyProcessing
    Get-LapsDiagnostics
  text:
    fr:
      title: Mot de passe administrateur local non géré (LAPS absent)
      summary: >-
        Le mot de passe du compte administrateur local n'est pas géré par LAPS. Il est
        probablement identique sur plusieurs machines : en voler un donne accès à toutes.
      detail: >-
        Ni Windows LAPS (BackupDirectory ≠ 0 dans la stratégie ou la configuration locale),
        ni l'ancienne LAPS (AdmPwdEnabled = 1 et extension installée) sur une machine jointe
        à un domaine ou à Entra ID.
      impact: >-
        Windows LAPS se configure par GPO (Active Directory) ou Intune (Entra ID) ;
        Update-LapsADSchema modifie le schéma AD et se lance une seule fois par forêt.
      gpo: Configuration ordinateur > Stratégies > Modèles d'administration > Système > LAPS > Configurer le répertoire de sauvegarde des mots de passe
    en:
      title: Local administrator password not managed (no LAPS)
      summary: >-
        The local administrator password is not managed by LAPS. It is probably the same on
        several machines: stealing one gives access to all of them.
      detail: >-
        Neither Windows LAPS (BackupDirectory ≠ 0 in policy or local configuration) nor
        legacy LAPS (AdmPwdEnabled = 1 and extension installed) on a machine joined to a
        domain or Entra ID.
      impact: >-
        Windows LAPS is configured through GPO (Active Directory) or Intune (Entra ID);
        Update-LapsADSchema changes the AD schema and is run once per forest.
      gpo: Computer Configuration > Policies > Administrative Templates > System > LAPS > Configure password backup directory

# ---------------------------------------------------------------- BitLocker
- id: BDE-001
  category: bitlocker
  level: critical
  admin: true
  refs:
    - name: "Microsoft — BitLocker"
      url: https://learn.microsoft.com/windows/security/operating-system-security/data-protection/bitlocker/
    - name: "MITRE ATT&CK T1005 — Data from Local System"
      url: https://attack.mitre.org/techniques/T1005/
  remediation: |
    Enable-BitLocker -MountPoint {{ps .mount}} -EncryptionMethod XtsAes256 -UsedSpaceOnly -TpmProtector
    Add-BitLockerKeyProtector -MountPoint {{ps .mount}} -RecoveryPasswordProtector
    (Get-BitLockerVolume -MountPoint {{ps .mount}}).KeyProtector
  text:
    fr:
      title: Disque système non chiffré
      summary: >-
        Le disque de Windows n'est pas chiffré. En cas de vol ou de perte de la machine (ou
        du disque), toutes les données sont lisibles par n'importe qui.
      detail: >-
        Win32_EncryptableVolume du volume système : ConversionStatus = déchiffré. Critique
        sur un appareil portable, Attention sur un poste fixe ou un serveur.
      impact: >-
        Noter et sauvegarder la clé de récupération (AD, Entra ID ou coffre) AVANT le
        redémarrage. Le chiffrement se fait en arrière-plan ; un redémarrage peut être
        demandé pour tester le TPM.
      gpo: Configuration ordinateur > Modèles d'administration > Composants Windows > Chiffrement de lecteur BitLocker
    en:
      title: System drive not encrypted
      summary: >-
        The Windows drive is not encrypted. If the machine (or the disk) is stolen or lost,
        all data can be read by anyone.
      detail: >-
        Win32_EncryptableVolume of the system volume: ConversionStatus = decrypted.
        Critical on a portable device, Warning on a desktop or server.
      impact: >-
        Write down and back up the recovery key (AD, Entra ID or a vault) BEFORE
        restarting. Encryption runs in the background; a restart may be requested to test
        the TPM.
      gpo: Computer Configuration > Administrative Templates > Windows Components > BitLocker Drive Encryption

- id: BDE-002
  category: bitlocker
  level: critical
  admin: true
  refs:
    - name: "Microsoft — BitLocker"
      url: https://learn.microsoft.com/windows/security/operating-system-security/data-protection/bitlocker/
  remediation: |
    Resume-BitLocker -MountPoint {{ps .mount}}
    Get-BitLockerVolume -MountPoint {{ps .mount}}
  text:
    fr:
      title: Protection BitLocker suspendue
      summary: >-
        Le disque est chiffré mais la protection est suspendue : la clé est stockée en clair
        sur le disque, qui est donc lisible comme s'il n'était pas chiffré.
      detail: >-
        Volume chiffré (ConversionStatus 1 ou 4) avec ProtectionStatus = 0 : protection
        suspendue (souvent après une mise à jour du BIOS) ou chiffrement de l'appareil en
        attente d'activation.
      impact: Si aucun protecteur n'existe (chiffrement en attente), ajouter d'abord un protecteur TPM et un mot de passe de récupération.
    en:
      title: BitLocker protection suspended
      summary: >-
        The drive is encrypted but protection is suspended: the key is stored in clear on
        the disk, which can therefore be read as if it were not encrypted.
      detail: >-
        Encrypted volume (ConversionStatus 1 or 4) with ProtectionStatus = 0: suspended
        protection (often after a BIOS update) or device encryption waiting for activation.
      impact: If no protector exists (encryption pending), first add a TPM protector and a recovery password.

- id: BDE-003
  category: bitlocker
  level: info
  admin: true
  profiles: [workstation]
  refs:
    - name: "Microsoft — BitLocker countermeasures"
      url: https://learn.microsoft.com/windows/security/operating-system-security/data-protection/bitlocker/countermeasures
  remediation: |
    Add-BitLockerKeyProtector -MountPoint {{ps .mount}} -TpmAndPinProtector -Pin (Read-Host -AsSecureString 'PIN')
  text:
    fr:
      title: Portable protégé par le TPM seul, sans code PIN
      summary: >-
        Le portable déverrouille son disque automatiquement au démarrage. Un voleur équipé
        peut tenter des attaques matérielles ; un code PIN au démarrage les bloque.
      detail: >-
        Protecteurs du volume système : TPM, sans TPM+PIN ni clé de démarrage.
      impact: >-
        L'utilisateur devra saisir le PIN à chaque démarrage. La stratégie « Exiger une
        authentification supplémentaire au démarrage » doit autoriser le PIN.
      gpo: Configuration ordinateur > Modèles d'administration > Composants Windows > Chiffrement de lecteur BitLocker > Lecteurs du système d'exploitation > Exiger une authentification supplémentaire au démarrage
    en:
      title: Laptop protected by TPM only, without a PIN
      summary: >-
        The laptop unlocks its disk automatically at startup. A well-equipped thief can try
        hardware attacks; a startup PIN blocks them.
      detail: System volume protectors — TPM, without TPM+PIN or startup key.
      impact: >-
        The user will have to type the PIN at every startup. The "Require additional
        authentication at startup" policy must allow a PIN.
      gpo: Computer Configuration > Administrative Templates > Windows Components > BitLocker Drive Encryption > Operating System Drives > Require additional authentication at startup

- id: BDE-004
  category: bitlocker
  level: warning
  admin: true
  refs:
    - name: "Microsoft — BitLocker recovery overview"
      url: https://learn.microsoft.com/windows/security/operating-system-security/data-protection/bitlocker/recovery-overview
  remediation: |
    Add-BitLockerKeyProtector -MountPoint {{ps .mount}} -RecoveryPasswordProtector
    $kp = (Get-BitLockerVolume -MountPoint {{ps .mount}}).KeyProtector | Where-Object KeyProtectorType -eq 'RecoveryPassword' | Select-Object -First 1
    {{if eq .join "domain"}}Backup-BitLockerKeyProtector -MountPoint {{ps .mount}} -KeyProtectorId $kp.KeyProtectorId{{else if .entra}}BackupToAAD-BitLockerKeyProtector -MountPoint {{ps .mount}} -KeyProtectorId $kp.KeyProtectorId{{else}}$kp.RecoveryPassword{{end}}
  text:
    fr:
      title: Volume chiffré sans mot de passe de récupération
      summary: >-
        Ce volume chiffré n'a pas de mot de passe de récupération : en cas de panne du TPM,
        de changement de carte mère ou de mise à jour du BIOS, les données seraient perdues.
      detail: Aucun protecteur de type RecoveryPassword (numérique) sur un volume chiffré.
      impact: Conserver le mot de passe de récupération en lieu sûr (AD, Entra ID, coffre-fort), jamais sur la machine elle-même.
    en:
      title: Encrypted volume without a recovery password
      summary: >-
        This encrypted volume has no recovery password: if the TPM fails, the motherboard is
        replaced or the BIOS is updated, the data would be lost.
      detail: No RecoveryPassword (numerical) protector on an encrypted volume.
      impact: Keep the recovery password somewhere safe (AD, Entra ID, a vault), never on the machine itself.

- id: BDE-005
  category: bitlocker
  level: warning
  admin: true
  refs:
    - name: "Microsoft — BitLocker"
      url: https://learn.microsoft.com/windows/security/operating-system-security/data-protection/bitlocker/
  remediation: |
    Enable-BitLocker -MountPoint {{ps .mount}} -EncryptionMethod XtsAes256 -UsedSpaceOnly -RecoveryPasswordProtector
    Enable-BitLockerAutoUnlock -MountPoint {{ps .mount}}
  text:
    fr:
      title: Volume de données non chiffré
      summary: >-
        Un disque ou une partition de données n'est pas chiffré : son contenu est lisible si
        le disque est volé ou réutilisé.
      detail: Volume fixe de données (VolumeType 1) avec une lettre de lecteur et ConversionStatus = déchiffré.
      impact: Le déverrouillage automatique exige que le volume système soit chiffré ; sauvegarder la clé de récupération.
    en:
      title: Data volume not encrypted
      summary: >-
        A data disk or partition is not encrypted: its content can be read if the disk is
        stolen or reused.
      detail: Fixed data volume (VolumeType 1) with a drive letter and ConversionStatus = decrypted.
      impact: Auto-unlock requires the system volume to be encrypted; back up the recovery key.

- id: BDE-006
  category: bitlocker
  level: info
  admin: true
  refs:
    - name: "Microsoft — BitLocker recovery overview"
      url: https://learn.microsoft.com/windows/security/operating-system-security/data-protection/bitlocker/recovery-overview
  remediation: |
    $kp = (Get-BitLockerVolume -MountPoint {{ps .mount}}).KeyProtector | Where-Object KeyProtectorType -eq 'RecoveryPassword' | Select-Object -First 1
    {{if .entra}}BackupToAAD-BitLockerKeyProtector{{else}}Backup-BitLockerKeyProtector{{end}} -MountPoint {{ps .mount}} -KeyProtectorId $kp.KeyProtectorId
  text:
    fr:
      title: Sauvegarde des clés de récupération non imposée
      summary: >-
        Aucune stratégie n'oblige à sauvegarder la clé de récupération BitLocker dans
        l'annuaire. Il n'est pas possible de vérifier depuis la machine que la clé y est
        bien : à contrôler dans AD ou Entra ID.
      detail: >-
        Machine jointe, volume système chiffré, et ni OSRequireActiveDirectoryBackup ni
        OSActiveDirectoryBackup dans HKLM\SOFTWARE\Policies\Microsoft\FVE.
      gpo: Configuration ordinateur > Modèles d'administration > Composants Windows > Chiffrement de lecteur BitLocker > Lecteurs du système d'exploitation > Choisir comment les lecteurs du système d'exploitation protégés par BitLocker peuvent être récupérés
    en:
      title: Recovery key backup not enforced
      summary: >-
        No policy requires the BitLocker recovery key to be backed up to the directory. It
        cannot be checked from the machine that the key is actually there: verify it in AD
        or Entra ID.
      detail: >-
        Joined machine, encrypted system volume, and neither OSRequireActiveDirectoryBackup
        nor OSActiveDirectoryBackup in HKLM\SOFTWARE\Policies\Microsoft\FVE.
      gpo: Computer Configuration > Administrative Templates > Windows Components > BitLocker Drive Encryption > Operating System Drives > Choose how BitLocker-protected operating system drives can be recovered

# ---------------------------------------------------------------- Microsoft Defender
- id: DEF-001
  category: defender
  level: critical
  refs:
    - name: "MITRE ATT&CK T1562.001 — Disable or Modify Tools"
      url: https://attack.mitre.org/techniques/T1562/001/
  remediation: |
    Set-MpPreference -DisableRealtimeMonitoring $false
    Get-MpComputerStatus | Select-Object AntivirusEnabled, RealTimeProtectionEnabled
  text:
    fr:
      title: Protection antivirus en temps réel désactivée
      summary: >-
        La protection en temps réel de Microsoft Defender est désactivée et aucun autre
        antivirus actif n'a été détecté : les fichiers malveillants ne sont pas bloqués.
      detail: MSFT_MpComputerStatus — RealTimeProtectionEnabled ou AntivirusEnabled = faux, mode Normal.
      gpo: Configuration ordinateur > Modèles d'administration > Composants Windows > Antivirus Microsoft Defender > Protection en temps réel > Désactiver la protection en temps réel
    en:
      title: Real-time antivirus protection disabled
      summary: >-
        Microsoft Defender real-time protection is disabled and no other active antivirus
        was found: malicious files are not blocked.
      detail: MSFT_MpComputerStatus — RealTimeProtectionEnabled or AntivirusEnabled = false, Normal mode.
      gpo: Computer Configuration > Administrative Templates > Windows Components > Microsoft Defender Antivirus > Real-time Protection > Turn off real-time protection

- id: DEF-002
  category: defender
  level: warning
  profiles: [workstation]
  refs:
    - name: "Microsoft — Tamper protection"
      url: https://learn.microsoft.com/defender-endpoint/prevent-changes-to-security-settings-with-tamper-protection
    - name: "MITRE ATT&CK T1562.001 — Disable or Modify Tools"
      url: https://attack.mitre.org/techniques/T1562/001/
  remediation: |
    Start-Process 'windowsdefender://threatsettings'
  text:
    fr:
      title: Protection contre les falsifications désactivée
      summary: >-
        Un logiciel malveillant ayant obtenu les droits d'administration peut désactiver
        Defender. La protection contre les falsifications l'en empêche.
      detail: MSFT_MpComputerStatus — IsTamperProtected = faux.
      impact: >-
        Se règle dans Sécurité Windows > Protection contre les virus et menaces > Gérer les
        paramètres, ou dans Intune ; pas par PowerShell.
    en:
      title: Tamper protection disabled
      summary: >-
        Malware that has obtained administrator rights can turn Defender off. Tamper
        protection prevents it.
      detail: MSFT_MpComputerStatus — IsTamperProtected = false.
      impact: >-
        Set it in Windows Security > Virus & threat protection > Manage settings, or in
        Intune; not through PowerShell.

- id: DEF-003
  category: defender
  level: warning
  refs:
    - name: "Microsoft — Microsoft Defender Antivirus security intelligence updates"
      url: https://learn.microsoft.com/defender-endpoint/microsoft-defender-antivirus-updates
  remediation: |
    Update-MpSignature
  text:
    fr:
      title: Signatures antivirus anciennes
      summary: >-
        Les signatures de Microsoft Defender ont {days} jours : les menaces récentes ne sont
        pas reconnues.
      detail: MSFT_MpComputerStatus — AntivirusSignatureAge supérieur à 7 jours.
      impact: Si la mise à jour échoue, vérifier l'accès à Windows Update ou au serveur WSUS.
    en:
      title: Outdated antivirus signatures
      summary: >-
        Microsoft Defender signatures are {days} days old: recent threats are not
        recognised.
      detail: MSFT_MpComputerStatus — AntivirusSignatureAge above 7 days.
      impact: If the update fails, check access to Windows Update or the WSUS server.

- id: DEF-004
  category: defender
  level: critical
  admin: true
  refs:
    - name: "MITRE ATT&CK T1562.001 — Disable or Modify Tools"
      url: https://attack.mitre.org/techniques/T1562/001/
    - name: "Microsoft — Common mistakes to avoid when defining exclusions"
      url: https://learn.microsoft.com/defender-endpoint/common-exclusion-mistakes-microsoft-defender-antivirus
  remediation: |
    Remove-MpPreference {{.flag}} {{ps .value}}
  text:
    fr:
      title: Exclusion antivirus trop large
      summary: >-
        Microsoft Defender ignore une partie importante de la machine (un lecteur entier, les
        profils, les dossiers temporaires ou des types de fichiers exécutables). Un
        logiciel malveillant n'a qu'à s'y placer pour ne pas être détecté.
      detail: >-
        Exclusions de chemin (lecteur, \Users, \Temp, AppData, Téléchargements…),
        d'extension (exe, dll, ps1, bat…) ou de processus (powershell, cmd, mshta…).
        Lecture des exclusions locales : droits administrateur requis ; celles imposées par
        stratégie sont visibles sans.
      impact: Vérifier avec l'éditeur du logiciel concerné quelles exclusions précises sont nécessaires avant de supprimer.
      gpo: Configuration ordinateur > Modèles d'administration > Composants Windows > Antivirus Microsoft Defender > Exclusions
    en:
      title: Overly broad antivirus exclusion
      summary: >-
        Microsoft Defender ignores a large part of the machine (a whole drive, user
        profiles, temporary folders or executable file types). Malware only has to sit there
        to go undetected.
      detail: >-
        Path exclusions (drive, \Users, \Temp, AppData, Downloads…), extension exclusions
        (exe, dll, ps1, bat…) or process exclusions (powershell, cmd, mshta…). Reading local
        exclusions requires administrator rights; policy ones are visible without.
      impact: Check with the software vendor which specific exclusions are needed before removing.
      gpo: Computer Configuration > Administrative Templates > Windows Components > Microsoft Defender Antivirus > Exclusions

- id: DEF-005
  category: defender
  level: info
  refs:
    - name: "Microsoft — Cloud protection and Microsoft Defender Antivirus"
      url: https://learn.microsoft.com/defender-endpoint/cloud-protection-microsoft-defender-antivirus
  remediation: |
    Set-MpPreference -MAPSReporting Advanced -SubmitSamplesConsent SendSafeSamples
  text:
    fr:
      title: Protection dans le cloud désactivée
      summary: >-
        La protection fournie par le cloud de Defender (ou l'envoi automatique d'échantillons)
        est désactivée : les nouvelles menaces sont détectées plus tard.
      detail: MSFT_MpPreference — MAPSReporting = 0 ou SubmitSamplesConsent = 2 (jamais).
      gpo: Configuration ordinateur > Modèles d'administration > Composants Windows > Antivirus Microsoft Defender > MAPS
    en:
      title: Cloud-delivered protection disabled
      summary: >-
        Defender cloud-delivered protection (or automatic sample submission) is disabled:
        new threats are detected later.
      detail: MSFT_MpPreference — MAPSReporting = 0 or SubmitSamplesConsent = 2 (never).
      gpo: Computer Configuration > Administrative Templates > Windows Components > Microsoft Defender Antivirus > MAPS

- id: DEF-006
  category: defender
  level: info
  refs:
    - name: "Microsoft — Detect and block potentially unwanted applications"
      url: https://learn.microsoft.com/defender-endpoint/detect-block-potentially-unwanted-apps-microsoft-defender-antivirus
  remediation: |
    Set-MpPreference -PUAProtection Enabled
  text:
    fr:
      title: Blocage des applications potentiellement indésirables désactivé
      summary: >-
        Defender laisse s'installer les logiciels potentiellement indésirables (barres
        d'outils, publiciels, mineurs de cryptomonnaie…).
      detail: MSFT_MpPreference — PUAProtection = 0.
      gpo: Configuration ordinateur > Modèles d'administration > Composants Windows > Antivirus Microsoft Defender > Configurer la détection des applications potentiellement indésirables
    en:
      title: Potentially unwanted application blocking disabled
      summary: >-
        Defender lets potentially unwanted software install (toolbars, adware, cryptocurrency
        miners…).
      detail: MSFT_MpPreference — PUAProtection = 0.
      gpo: Computer Configuration > Administrative Templates > Windows Components > Microsoft Defender Antivirus > Configure detection for potentially unwanted applications

- id: DEF-007
  category: defender
  level: info
  refs:
    - name: "Microsoft — Attack surface reduction rules"
      url: https://learn.microsoft.com/defender-endpoint/attack-surface-reduction
  remediation: |
    Add-MpPreference -AttackSurfaceReductionRules_Ids 9e6c4e1f-7d60-472f-ba1a-a39ef669e4b2 -AttackSurfaceReductionRules_Actions AuditMode
  text:
    fr:
      title: Aucune règle de réduction de la surface d'attaque
      summary: >-
        Aucune règle de réduction de la surface d'attaque (ASR) n'est active. Ces règles
        bloquent des comportements typiques des attaques (macros Office qui lancent des
        programmes, vol de mots de passe en mémoire…).
      detail: >-
        MSFT_MpPreference — aucune règle ASR en mode Bloquer, Audit ou Avertir. La commande
        proposée active en audit la règle qui protège LSASS contre le vol d'identifiants.
      impact: Commencer en mode Audit et consulter les journaux avant de passer en mode Bloquer.
      gpo: Configuration ordinateur > Modèles d'administration > Composants Windows > Antivirus Microsoft Defender > Microsoft Defender Exploit Guard > Réduction de la surface d'attaque
    en:
      title: No attack surface reduction rule
      summary: >-
        No attack surface reduction (ASR) rule is active. These rules block behaviours
        typical of attacks (Office macros launching programs, credential theft from
        memory…).
      detail: >-
        MSFT_MpPreference — no ASR rule in Block, Audit or Warn mode. The suggested command
        enables, in audit mode, the rule that protects LSASS against credential theft.
      impact: Start in Audit mode and review the logs before switching to Block mode.
      gpo: Computer Configuration > Administrative Templates > Windows Components > Microsoft Defender Antivirus > Microsoft Defender Exploit Guard > Attack Surface Reduction

# ---------------------------------------------------------------- Partages SMB
- id: SMB-001
  category: smb
  level: critical
  admin: true
  refs:
    - name: "MITRE ATT&CK T1039 — Data from Network Shared Drive"
      url: https://attack.mitre.org/techniques/T1039/
    - name: "MITRE ATT&CK T1486 — Data Encrypted for Impact"
      url: https://attack.mitre.org/techniques/T1486/
  remediation: |
    Revoke-SmbShareAccess -Name {{ps .share}} -AccountName ((New-Object Security.Principal.SecurityIdentifier {{ps .sid}}).Translate([Security.Principal.NTAccount]).Value) -Force
    Get-SmbShareAccess -Name {{ps .share}}
  text:
    fr:
      title: Partage modifiable par tout le monde
      summary: >-
        Un dossier partagé peut être modifié par tous les utilisateurs (voire sans compte).
        Un rançongiciel lancé depuis n'importe quel poste peut en chiffrer ou détruire le
        contenu.
      detail: >-
        Partage non administratif dont les droits de partage ET les droits NTFS accordent
        l'écriture à Tout le monde, Utilisateurs, Utilisateurs authentifiés, Invités ou
        ANONYMOUS.
      impact: >-
        Accorder ensuite les droits au groupe qui en a réellement besoin
        (Grant-SmbShareAccess) avant que les utilisateurs perdent l'accès.
    en:
      title: Share writable by everyone
      summary: >-
        A shared folder can be modified by all users (or even without an account).
        Ransomware started from any workstation can encrypt or destroy its content.
      detail: >-
        Non-administrative share whose share permissions AND NTFS permissions grant write
        access to Everyone, Users, Authenticated Users, Guests or ANONYMOUS.
      impact: >-
        Then grant access to the group that really needs it (Grant-SmbShareAccess) before
        users lose access.

- id: SMB-002
  category: smb
  level: warning
  admin: true
  refs:
    - name: "MITRE ATT&CK T1039 — Data from Network Shared Drive"
      url: https://attack.mitre.org/techniques/T1039/
  remediation: |
    Revoke-SmbShareAccess -Name {{ps .share}} -AccountName ((New-Object Security.Principal.SecurityIdentifier {{ps .sid}}).Translate([Security.Principal.NTAccount]).Value) -Force
    Get-SmbShareAccess -Name {{ps .share}}
  text:
    fr:
      title: Partage lisible par tout le monde
      summary: >-
        Un dossier partagé est lisible par tous les utilisateurs. Vérifier qu'il ne contient
        rien de confidentiel (paie, contrats, sauvegardes…).
      detail: >-
        Partage non administratif dont les droits de partage et NTFS accordent la lecture à
        un groupe large, sans écriture.
      impact: Accorder ensuite la lecture au groupe qui en a besoin (Grant-SmbShareAccess -AccessRight Read).
    en:
      title: Share readable by everyone
      summary: >-
        A shared folder can be read by all users. Check that it contains nothing
        confidential (payroll, contracts, backups…).
      detail: >-
        Non-administrative share whose share and NTFS permissions grant read access to a
        broad group, without write access.
      impact: Then grant read access to the group that needs it (Grant-SmbShareAccess -AccessRight Read).

- id: SMB-003
  category: smb
  level: critical
  refs:
    - name: "Microsoft — Detect, enable and disable SMBv1, SMBv2 and SMBv3"
      url: https://learn.microsoft.com/windows-server/storage/file-server/troubleshoot/detect-enable-and-disable-smbv1-v2-v3
    - name: "MITRE ATT&CK T1210 — Exploitation of Remote Services"
      url: https://attack.mitre.org/techniques/T1210/
  remediation: |
    Set-SmbServerConfiguration -EnableSMB1Protocol $false -Force
  text:
    fr:
      title: Serveur SMBv1 activé
      summary: >-
        La machine accepte encore l'ancien protocole de partage SMBv1, obsolète et à
        l'origine de rançongiciels comme WannaCry.
      detail: MSFT_SmbServerConfiguration.EnableSMB1Protocol = vrai (ou registre LanmanServer\Parameters\SMB1 ≠ 0 avec le pilote srv actif).
      impact: >-
        Un vieux copieur ou NAS qui ne parle que SMBv1 ne pourra plus accéder aux partages
        de cette machine : le recenser avant (journal Microsoft-Windows-SMBServer/Audit).
    en:
      title: SMBv1 server enabled
      summary: >-
        The machine still accepts the old SMBv1 file sharing protocol, obsolete and behind
        ransomware such as WannaCry.
      detail: MSFT_SmbServerConfiguration.EnableSMB1Protocol = true (or registry LanmanServer\Parameters\SMB1 ≠ 0 with the srv driver active).
      impact: >-
        An old copier or NAS that only speaks SMBv1 will no longer reach this machine's
        shares: identify them first (Microsoft-Windows-SMBServer/Audit log).

- id: SMB-004
  category: smb
  level: critical
  refs:
    - name: "Microsoft — Detect, enable and disable SMBv1, SMBv2 and SMBv3"
      url: https://learn.microsoft.com/windows-server/storage/file-server/troubleshoot/detect-enable-and-disable-smbv1-v2-v3
  remediation: |
    Disable-WindowsOptionalFeature -Online -FeatureName SMB1Protocol -NoRestart
  text:
    fr:
      title: Client SMBv1 activé
      summary: >-
        La machine peut encore se connecter en SMBv1, protocole obsolète et vulnérable, à
        d'autres équipements.
      detail: Pilote mrxsmb10 présent et non désactivé.
      impact: >-
        Redémarrage nécessaire. Les accès à un ancien NAS ou copieur en SMBv1 seront
        coupés : prévoir sa mise à jour ou son remplacement.
    en:
      title: SMBv1 client enabled
      summary: >-
        The machine can still connect over SMBv1, an obsolete and vulnerable protocol, to
        other devices.
      detail: mrxsmb10 driver present and not disabled.
      impact: >-
        A restart is required. Access to an old SMBv1 NAS or copier will stop: plan its
        update or replacement.

- id: SMB-005
  category: smb
  level: warning
  refs:
    - name: "Microsoft — Overview of Server Message Block signing"
      url: https://learn.microsoft.com/troubleshoot/windows-server/networking/overview-server-message-block-signing
    - name: "MITRE ATT&CK T1557.001 — LLMNR/NBT-NS Poisoning and SMB Relay"
      url: https://attack.mitre.org/techniques/T1557/001/
  remediation: |
    Set-SmbServerConfiguration -RequireSecuritySignature $true -Force
  text:
    fr:
      title: Signature SMB non exigée
      summary: >-
        Les échanges de fichiers avec cette machine ne sont pas obligatoirement signés : un
        attaquant sur le réseau peut relayer une connexion pour se faire passer pour un
        utilisateur.
      detail: >-
        RequireSecuritySignature = faux côté serveur. Attention sur un poste ou un serveur,
        Critique sur un contrôleur de domaine.
      impact: Vérifier la compatibilité des anciens équipements (NAS, copieurs) ; léger coût en performances.
      gpo: Configuration ordinateur > Stratégies > Paramètres Windows > Paramètres de sécurité > Stratégies locales > Options de sécurité > Serveur réseau Microsoft — communications signées numériquement (toujours)
    en:
      title: SMB signing not required
      summary: >-
        File exchanges with this machine are not required to be signed: an attacker on the
        network can relay a connection to impersonate a user.
      detail: >-
        RequireSecuritySignature = false on the server side. Warning on a workstation or
        server, Critical on a domain controller.
      impact: Check compatibility with old devices (NAS, copiers); slight performance cost.
      gpo: Computer Configuration > Policies > Windows Settings > Security Settings > Local Policies > Security Options > Microsoft network server — Digitally sign communications (always)

- id: SMB-006
  category: smb
  level: warning
  refs:
    - name: "Microsoft — Guest access in SMB2 and SMB3 disabled by default"
      url: https://learn.microsoft.com/troubleshoot/windows-server/networking/guest-access-in-smb2-is-disabled-by-default
  remediation: |
    Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Services\LanmanWorkstation\Parameters' -Name AllowInsecureGuestAuth -Value 0 -Type DWord
  text:
    fr:
      title: Connexions invité non sécurisées autorisées
      summary: >-
        La machine accepte de se connecter à des partages sans aucune authentification, ce
        qui permet à un faux serveur de lui fournir des fichiers piégés.
      detail: AllowInsecureGuestAuth = 1 (stratégie ou LanmanWorkstation\Parameters).
      impact: >-
        Les NAS configurés en accès invité ne seront plus accessibles : leur créer un compte.
      gpo: Configuration ordinateur > Modèles d'administration > Réseau > Station de travail Lanman > Activer les ouvertures de session d'invité non sécurisées
    en:
      title: Insecure guest logons allowed
      summary: >-
        The machine agrees to connect to shares without any authentication, which lets a
        rogue server hand it booby-trapped files.
      detail: AllowInsecureGuestAuth = 1 (policy or LanmanWorkstation\Parameters).
      impact: >-
        NAS devices set up with guest access will no longer be reachable: create an account on them.
      gpo: Computer Configuration > Administrative Templates > Network > Lanman Workstation > Enable insecure guest logons

# ---------------------------------------------------------------- Pare-feu
- id: FW-001
  category: firewall
  level: critical
  refs:
    - name: "Microsoft — Windows Firewall"
      url: https://learn.microsoft.com/windows/security/operating-system-security/network-security/windows-firewall/
    - name: "MITRE ATT&CK T1562.004 — Disable or Modify System Firewall"
      url: https://attack.mitre.org/techniques/T1562/004/
  remediation: |
    Set-NetFirewallProfile -Profile {{.profile}} -Enabled True
  text:
    fr:
      title: Pare-feu désactivé
      summary: >-
        Le pare-feu Windows est désactivé pour un type de réseau : la machine accepte toutes
        les connexions entrantes quand elle y est connectée (par exemple sur un Wi-Fi public).
      detail: Profil {profile} — FirewallEnabled = faux, et aucun pare-feu tiers actif détecté.
      impact: Vérifier qu'aucune application ne dépend de ports ouverts sans règle explicite (les tester après activation).
      gpo: Configuration ordinateur > Stratégies > Paramètres Windows > Paramètres de sécurité > Pare-feu Windows Defender avec fonctions avancées de sécurité
    en:
      title: Firewall disabled
      summary: >-
        Windows Firewall is disabled for a network type: the machine accepts all incoming
        connections when connected to it (for example on public Wi-Fi).
      detail: Profile {profile} — FirewallEnabled = false, and no active third-party firewall found.
      impact: Check that no application relies on open ports without an explicit rule (test them after enabling).
      gpo: Computer Configuration > Policies > Windows Settings > Security Settings > Windows Defender Firewall with Advanced Security

- id: FW-002
  category: firewall
  level: critical
  refs:
    - name: "Microsoft — Windows Firewall"
      url: https://learn.microsoft.com/windows/security/operating-system-security/network-security/windows-firewall/
  remediation: |
    Set-NetFirewallProfile -Profile {{.profile}} -DefaultInboundAction Block
  text:
    fr:
      title: Pare-feu ouvert par défaut en entrée
      summary: >-
        Le pare-feu est actif mais laisse entrer par défaut toutes les connexions qui ne sont
        pas explicitement bloquées : il ne protège presque rien.
      detail: Profil {profile} — DefaultInboundAction = Autoriser.
      impact: Les services qui n'ont pas de règle d'autorisation deviendront injoignables depuis le réseau.
      gpo: Configuration ordinateur > Stratégies > Paramètres Windows > Paramètres de sécurité > Pare-feu Windows Defender avec fonctions avancées de sécurité > Propriétés > Connexions entrantes
    en:
      title: Firewall open by default for inbound traffic
      summary: >-
        The firewall is on but lets in by default every connection that is not explicitly
        blocked: it protects almost nothing.
      detail: Profile {profile} — DefaultInboundAction = Allow.
      impact: Services without an allow rule will become unreachable from the network.
      gpo: Computer Configuration > Policies > Windows Settings > Security Settings > Windows Defender Firewall with Advanced Security > Properties > Inbound connections

- id: FW-003
  category: firewall
  level: warning
  refs:
    - name: "MITRE ATT&CK T1562.004 — Disable or Modify System Firewall"
      url: https://attack.mitre.org/techniques/T1562/004/
  remediation: |
    Get-NetFirewallRule -DisplayName {{ps .rule}} | Disable-NetFirewallRule
  text:
    fr:
      title: Règle de pare-feu qui autorise tout
      summary: >-
        Une règle autorise en entrée tous les ports, depuis toutes les adresses, sans se
        limiter à un programme : elle annule l'effet du pare-feu.
      detail: Règle entrante active « Autoriser », LocalPorts = *, RemoteAddresses = *, sans programme ni service.
      impact: Identifier l'application qui a besoin de cette règle et la remplacer par une règle limitée à ses ports.
    en:
      title: Firewall rule allowing everything
      summary: >-
        A rule allows inbound traffic on all ports, from all addresses, without being
        limited to a program: it cancels out the firewall.
      detail: Enabled inbound "Allow" rule, LocalPorts = *, RemoteAddresses = *, with no program or service.
      impact: Identify the application that needs this rule and replace it with a rule limited to its ports.

- id: FW-004
  category: firewall
  level: warning
  refs:
    - name: "MITRE ATT&CK T1021.001 — Remote Desktop Protocol"
      url: https://attack.mitre.org/techniques/T1021/001/
    - name: "MITRE ATT&CK T1021.002 — SMB/Windows Admin Shares"
      url: https://attack.mitre.org/techniques/T1021/002/
  remediation: |
    Get-NetFirewallRule -DisplayName {{ps .rule}} | Set-NetFirewallRule -Profile Domain,Private -RemoteAddress LocalSubnet
  text:
    fr:
      title: Port sensible ouvert à tous sur les réseaux publics
      summary: >-
        Un service sensible (bureau à distance, partage de fichiers, administration à
        distance, base de données…) est accessible depuis n'importe quelle adresse quand la
        machine est sur un réseau public (hôtel, gare, Wi-Fi invité).
      detail: >-
        Règle entrante active sur le profil Public, RemoteAddresses = *, couvrant RDP 3389,
        SMB 445/139, WinRM 5985/5986, SSH, Telnet, FTP, VNC ou une base de données.
      impact: Le service ne sera plus joignable depuis un réseau public ; passer par un VPN pour un accès à distance.
    en:
      title: Sensitive port open to all on public networks
      summary: >-
        A sensitive service (remote desktop, file sharing, remote management, database…) is
        reachable from any address when the machine is on a public network (hotel, station,
        guest Wi-Fi).
      detail: >-
        Enabled inbound rule on the Public profile, RemoteAddresses = *, covering RDP 3389,
        SMB 445/139, WinRM 5985/5986, SSH, Telnet, FTP, VNC or a database.
      impact: The service will no longer be reachable from a public network; use a VPN for remote access.

- id: FW-005
  category: firewall
  level: warning
  refs:
    - name: "MITRE ATT&CK T1574 — Hijack Execution Flow"
      url: https://attack.mitre.org/techniques/T1574/
  remediation: |
    icacls {{ps .path}} /remove:g {{.sids}}
    icacls {{ps .path}}
  text:
    fr:
      title: Règle de pare-feu pour un programme modifiable
      summary: >-
        Le pare-feu laisse entrer les connexions vers un programme que n'importe quel
        utilisateur peut remplacer : un logiciel malveillant n'aurait qu'à prendre sa place
        pour être joignable depuis le réseau.
      detail: Règle entrante active limitée à un programme dont le fichier ou le dossier est inscriptible par des non-administrateurs.
      impact: Seules les entrées explicites sont retirées ; vérifier que le programme fonctionne toujours.
    en:
      title: Firewall rule for a writable program
      summary: >-
        The firewall lets in connections to a program that any user can replace: malware
        would only have to take its place to be reachable from the network.
      detail: Enabled inbound rule limited to a program whose file or folder is writable by non-administrators.
      impact: Only explicit entries are removed; check that the program still works.
