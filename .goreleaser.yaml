# GoReleaser — publication des binaires dans les GitHub Releases à chaque tag vX.Y.Z.
version: 2
project_name: aplomb
dist: dist-goreleaser

builds:
  - id: aplomb
    main: ./cmd/aplomb
    binary: aplomb
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version={{ .Version }}"]
    targets: [windows_amd64, windows_arm64]
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: aplomb
    ids: [aplomb]
    name_template: "aplomb_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [zip]
    files: [LICENSE, README.md, README.en.md]

checksum:
  name_template: SHA256SUMS
  algorithm: sha256

changelog:
  use: github
  sort: asc
  filters:
    exclude: ["^docs:", "^ci:"]

release:
  draft: false
  prerelease: auto
  name_template: "Aplomb {{ .Version }}"
  footer: |
    **Windows** : téléchargez `aplomb_{{ .Version }}_windows_amd64.zip`, décompressez-le sur une clé USB et lancez `aplomb.exe` (de préférence en administrateur : clic droit → « Exécuter en tant qu'administrateur »).
    L'exécutable n'est pas encore signé : SmartScreen peut afficher un avertissement (« Informations complémentaires » → « Exécuter quand même ») et le Contrôle intelligent des applications de Windows 11 le bloque sans possibilité de passer outre (voir le README).
    Vérifiez l'intégrité avec `SHA256SUMS`. Aplomb ne modifie jamais la machine auditée.
