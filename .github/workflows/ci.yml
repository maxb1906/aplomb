name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        if: runner.os == 'Linux'
        run: make fmt-check
      - run: go vet ./...
      - name: go vet (GOOS=windows)
        if: runner.os == 'Linux'
        run: GOOS=windows go vet ./...
      - run: go test -race ./...

  frontend:
    name: Interface graphique (Svelte)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # Le jeu de démonstration (mock/data.json), vérifié par svelte-check, est généré par Go.
      - run: make frontend

  build:
    name: Build (cross-compilation)
    needs: [test, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: make build-all
      - name: SHA-256
        run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: aplomb-binaries
          path: dist/
          if-no-files-found: error
      - name: Vérification de la configuration GoReleaser (à blanc)
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "v2.20.1"
          args: release --snapshot --clean --skip=publish

  smoke-windows:
    name: Lancement de l'exe Windows
    needs: build
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: aplomb-binaries
          path: dist
      - name: Run aplomb.exe
        shell: pwsh
        run: |
          $exe = "./dist/aplomb-windows-amd64.exe"
          foreach ($a in @(@("--lang","fr","hello"), @("--lang","en","hello"), @("audit","--no-open"), @("version"), @("help"))) {
            & $exe @a
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $out = & $exe --lang fr hello | Out-String
          if ($out -notmatch "Bonjour depuis Aplomb") { Write-Error "sortie inattendue : $out"; exit 1 }
      - name: Interface graphique (ouverture de la fenêtre WebView2, fermeture dès qu'elle est prête)
        shell: pwsh
        timeout-minutes: 3
        run: |
          & ./dist/aplomb-windows-amd64.exe --data "$env:RUNNER_TEMP\gui-data" gui --smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  remediation-syntax:
    name: Syntaxe des scripts de remédiation (PowerShell 5.1 et 7)
    needs: build
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: aplomb-binaries
          path: dist
      - name: Générer les scripts à partir des fixtures
        shell: pwsh
        run: |
          $exe = "./dist/aplomb-windows-amd64.exe"
          foreach ($f in Get-ChildItem testdata/snapshots/*.json) {
            foreach ($lang in "fr", "en") {
              & $exe --lang $lang --data "$env:RUNNER_TEMP\data" evaluate --input $f.FullName --out "$env:RUNNER_TEMP\ps1-$lang" --format ps1 --no-open
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
          }
      - name: Analyse (PowerShell 7)
        shell: pwsh
        run: ./tools/check-ps1.ps1 -Path "$env:RUNNER_TEMP"
      - name: Analyse (Windows PowerShell 5.1)
        shell: powershell
        run: ./tools/check-ps1.ps1 -Path "$env:RUNNER_TEMP"

  lab:
    name: Lab (machine volontairement vulnérable)
    needs: build
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: aplomb-binaries
          path: dist
      - name: Audit de la machine neuve
        shell: pwsh
        run: |
          ./dist/aplomb-windows-amd64.exe --lang fr --data "$env:RUNNER_TEMP\data" audit --no-open --out "$env:RUNNER_TEMP\avant"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Dégradation (lab/make-vulnerable.ps1)
        shell: pwsh
        run: ./lab/make-vulnerable.ps1 -ConfirmLab
      - name: Audit après dégradation
        shell: pwsh
        run: |
          ./dist/aplomb-windows-amd64.exe --lang fr --data "$env:RUNNER_TEMP\data" audit --no-open --out "$env:RUNNER_TEMP\apres"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Vérification des détections
        shell: pwsh
        run: |
          $after = (Get-ChildItem "$env:RUNNER_TEMP\apres" -Recurse -Filter *.json | Select-Object -First 1).FullName
          $before = (Get-ChildItem "$env:RUNNER_TEMP\avant" -Recurse -Filter *.json | Select-Object -First 1).FullName
          ./lab/check-lab.ps1 -Report $after -Baseline $before
      - name: Syntaxe du script de remédiation réel
        if: always()
        shell: pwsh
        run: ./tools/check-ps1.ps1 -Path "$env:RUNNER_TEMP\apres"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lab-reports
          path: |
            ${{ runner.temp }}/avant
            ${{ runner.temp }}/apres
